media: media

content:
  - name: anuncios
    label: Anuncios
    type: collection
    path: content/anuncios
    format: json
    filename: "{primary}.json"
    fields:
      - name: titulo
        label: Título del anuncio
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: date
      - name: categoria
        label: Categoría
        type: select
        options:
          values:
            - Comunicado
            - Evento
            - KvK
            - Importante
      - name: prioridad
        label: Prioridad
        type: select
        options:
          values:
            - Normal
            - Importante
            - Urgente
      - name: hora_cdmx
        label: Hora de Ciudad de México
        type: string
      - name: hora_utc
        label: Hora UTC del juego
        type: string
      - name: texto
        label: Contenido
        type: text
        required: true

  - name: eventos
    label: Eventos y KvK
    type: collection
    path: content/eventos
    format: json
    filename: "{primary}.json"
    fields:
      - name: titulo
        label: Nombre del evento
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: date
      - name: categoria
        label: Categoría
        type: select
        options:
          values:
            - Actividad recurrente
            - KvK
            - Evento del reino
            - Arca de Osiris
            - Otro
      - name: hora_cdmx
        label: Hora de Ciudad de México
        type: string
      - name: hora_utc
        label: Hora UTC del juego
        type: string
      - name: texto
        label: Información del evento
        type: text
        required: true
  - name: reglamentos
    label: Reglamentos y jerarquía
    type: collection
    path: content/reglamentos
    format: json
    filename: "{primary}.json"
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: categoria
        label: Categoría
        type: select
        options:
          values:
            - Jerarquía
            - Reglamento general
            - MGE
            - Actividad y granjas
            - Otro
      - name: texto
        label: Contenido
        type: text
        required: true
  - name: estrategias
    label: Guías y estrategias
    type: collection
    path: content/estrategias
    format: json
    filename: "{primary}.json"
    fields:
      - name: titulo
        label: Título de la guía
        type: string
        required: true
      - name: categoria
        label: Categoría
        type: select
        options:
          values:
            - KvK
            - Comandantes y marchas
            - Arca de Osiris
            - Otro
      - name: resumen
        label: Resumen
        type: string
      - name: texto
        label: Contenido de la guía
        type: text
        required: true
      - name: enlace
        label: Enlace opcional
        type: string

  - name: reclutamiento
    label: Reclutamiento
    type: collection
    path: content/reclutamiento
    format: json
    filename: "{primary}.json"
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: categoria
        label: Subsección
        type: select
        options:
          values:
            - Requisitos
            - Plazas disponibles
            - Contacto
      - name: resumen
        label: Resumen
        type: string
      - name: texto
        label: Contenido
        type: text
        required: true
      - name: enlace
        label: Enlace opcional
        type: string
