<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d16"><meta name="description" content="Familia Tururu — Reino 1350 de Rise of Kingdoms.">
<title>Familia Tururu | Bienvenida</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16}
.cover{position:absolute;width:min(100vw,177.586vh);height:min(100vh,56.31vw);aspect-ratio:1648/928;left:50%;top:50%;transform:translate(-50%,-50%)}
.cover img{display:block;width:100%;height:100%;object-fit:contain}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 78%,rgba(255,174,45,.13),transparent 43%);opacity:.45;animation:ambientGlow 6s ease-in-out infinite alternate}
.sky-clouds::after{opacity:.8;transform:scale(1.12);animation-duration:36s;animation-direction:alternate-reverse}
.light-rays{position:absolute;z-index:1;inset:0;pointer-events:none;opacity:.42;background:repeating-conic-gradient(from 248deg at 50% 88%,transparent 0deg 5deg,rgba(255,222,154,.30) 6deg 7deg,transparent 8deg 14deg);mask-image:radial-gradient(ellipse at 50% 88%,#000 0%,rgba(0,0,0,.75) 30%,transparent 72%);animation:raysBreathe 7s ease-in-out infinite alternate}
.embers{position:absolute;z-index:2;inset:8% 4% 8%;pointer-events:none;background-image:radial-gradient(circle,rgba(255,226,145,.95) 0 1px,transparent 2px),radial-gradient(circle,rgba(255,178,67,.8) 0 1.2px,transparent 2.4px),radial-gradient(circle,rgba(255,244,194,.75) 0 .8px,transparent 2px);background-size:173px 211px,257px 293px,319px 239px;background-position:12px 20px,88px 72px,145px 31px;animation:emberFloat 18s linear infinite;opacity:.52}
.flag-wave{position:absolute;z-index:2;top:29%;height:26%;width:8.5%;pointer-events:none;opacity:.75;mix-blend-mode:screen;background:linear-gradient(100deg,transparent 0%,rgba(255,203,115,.08) 18%,rgba(255,244,205,.42) 46%,rgba(255,191,82,.18) 68%,transparent 100%);clip-path:polygon(8% 0,100% 12%,86% 76%,48% 100%,0 79%);transform-origin:50% 0;animation:flagRipple 3.8s ease-in-out infinite}
.flag-left{left:7.8%}.flag-right{right:7.8%;animation-delay:-1.9s}
@keyframes cloudDrift{from{transform:translateX(-3%) translateY(1%)}to{transform:translateX(3%) translateY(-1%)}}
@keyframes raysBreathe{from{opacity:.12;transform:scale(1)}to{opacity:.3;transform:scale(1.06)}}
@keyframes emberFloat{from{background-position:12px 20px,88px 72px,145px 31px;transform:translateY(3%)}to{background-position:42px -190px,28px -220px,205px -170px;transform:translateY(-3%)}}
@keyframes flagRipple{0%,100%{transform:skewX(-1deg) scaleX(.98)}50%{transform:skewX(2deg) scaleX(1.035)}}
.shield-shine{position:absolute;z-index:1;left:42.2%;top:6.5%;width:16.8%;height:33%;pointer-events:none;overflow:hidden;clip-path:polygon(50% 0,100% 13%,96% 69%,50% 100%,4% 69%,0 13%)}
.shield-shine::after{content:"";position:absolute;inset:-40% -100%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,220,.08) 47%,rgba(255,236,150,.65) 50%,rgba(255,255,255,.12) 53%,transparent 58%);transform:translateX(-110%);animation:shieldGleam 7s ease-in-out infinite}
.enter{overflow:hidden;isolation:isolate;animation:buttonPulse 3.8s ease-in-out infinite}
.enter::after{content:"";position:absolute;inset:-60% -90%;z-index:-1;background:linear-gradient(105deg,transparent 43%,rgba(255,244,190,.08) 47%,rgba(255,231,133,.5) 50%,rgba(255,255,255,.1) 53%,transparent 58%);transform:translateX(-110%);animation:buttonGleam 4.8s ease-in-out infinite}
@keyframes shieldGleam{0%,48%{transform:translateX(-110%)}72%,100%{transform:translateX(110%)}}
@keyframes buttonGleam{0%,55%{transform:translateX(-110%)}82%,100%{transform:translateX(110%)}}
@keyframes buttonPulse{0%,100%{box-shadow:0 0 8px #ffc94b,0 0 22px #e99b19,inset 0 0 10px #d18a1b}50%{box-shadow:0 0 12px #ffe18a,0 0 30px #f2ad32,inset 0 0 14px #e7a52d}}
@keyframes ambientGlow{from{opacity:.25}to{opacity:.65}}
.enter{position:absolute;left:37.7%;top:77.1%;width:24.6%;height:7.2%;display:flex;align-items:center;justify-content:center;border:3px solid #f7c94d;border-radius:15px;background:linear-gradient(180deg,#4a2108 0%,#170b05 48%,#321507 100%);box-shadow:0 0 8px #ffc94b,0 0 22px #e99b19,inset 0 0 10px #d18a1b;color:#ffe17a;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:clamp(11px,1.85vw,29px);font-weight:800;letter-spacing:.08em;text-shadow:0 1px 3px #8a4d00;cursor:pointer}
.enter:hover{filter:brightness(1.18);transform:scale(1.02)}
.enter:focus-visible{outline:3px solid #fff1b8;outline-offset:4px}
@media(max-width:600px){html,body{height:100%;min-height:100%;overflow:hidden}.cover{width:100vw;height:auto;max-height:none;aspect-ratio:1648/928;left:50%;top:50%;transform:translate(-50%,-50%)}.cover img{width:100%;height:100%;object-fit:contain;object-position:center center}.enter{left:37.7%;top:77.1%;width:24.6%;height:7.2%;border-width:2px;border-radius:9px;letter-spacing:.025em;font-size:clamp(8px,2.35vw,14px);white-space:nowrap}.light-rays{opacity:.22}.embers{opacity:.28}}
@media(prefers-reduced-motion:reduce){.cover::after,.shield-shine::after,.enter,.enter::after,.light-rays,.embers{animation:none}}
</style></head><body>
<main class="cover">
<img src="d0e1b123-1b4b-4bc7-836b-5a2205ca3bdc.png" alt="Familia Tururu — Reino 1350">
<span class="light-rays" aria-hidden="true"></span>
<span class="embers" aria-hidden="true"></span>
<span class="shield-shine" aria-hidden="true"></span>
<a class="enter" href="portal.html" aria-label="Entrar al portal">ENTRAR AL PORTAL</a>
</main></body></html>
